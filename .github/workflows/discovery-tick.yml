# Scheduler do agente de descoberta.
#
# O que faz: de tempos em tempos, faz um POST no Edge Function `discovery-worker`, que então roda
# a busca de vagas em segundo plano para os usuários "due" (mesmo com eles offline). O worker NÃO
# tem relógio próprio — este workflow é o "tique" que o aciona.
#
# Pré-requisitos (uma vez): no GitHub, em Settings › Secrets and variables › Actions, crie:
#   - SUPABASE_URL          = https://SEU_PROJECT_REF.supabase.co
#   - DISCOVERY_CRON_SECRET = o mesmo valor que você setou em `supabase secrets set DISCOVERY_CRON_SECRET=...`
#
# Você pode rodar manualmente em Actions › discovery-tick › Run workflow (workflow_dispatch).

name: discovery-tick

on:
  schedule:
    - cron: '0 * * * *' # de hora em hora (UTC). Comece conservador; ajuste depois.
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Acionar o discovery-worker
        run: |
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/discovery-worker" \
            -H "x-discovery-secret: $DISCOVERY_CRON_SECRET" \
            -H "content-type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DISCOVERY_CRON_SECRET: ${{ secrets.DISCOVERY_CRON_SECRET }}
