# Hourly trigger for the discovery-worker Edge Function, which has no scheduler of its own.
# Needs repo secrets SUPABASE_URL and DISCOVERY_CRON_SECRET, and the worker deployed with --no-verify-jwt.

name: discovery-tick

on:
  schedule:
    - cron: '0 * * * *' # hourly (UTC); the worker only processes users that are due
  workflow_dispatch: {} # manual run from the Actions tab

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the discovery-worker
        run: |
          curl -fsS -X POST "$SUPABASE_URL/functions/v1/discovery-worker" \
            -H "x-discovery-secret: $DISCOVERY_CRON_SECRET" \
            -H "content-type: application/json" \
            -d '{}'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DISCOVERY_CRON_SECRET: ${{ secrets.DISCOVERY_CRON_SECRET }}
